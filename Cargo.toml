[package]
name = "rust-monitor"
version = "0.1.0"
edition = "2024"
build = "src/build.rs"

[dependencies]
futures-util = "0.3.34"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.18.1"
tokio = { version = "1.53.2", features = ["net", "io-util", "rt-multi-thread", "time"] }
tokio-tungstenite = "0.30.0"
vt100 = "0.18.1"

[build-dependencies]
slint-build = "1.18.1"
